name: Release CI/CD

env:
  AZURE_WEBAPP_NAME: app-reg
  AZURE_WEBAPP_PACKAGE_PATH: '.'
  DOTNET_VERSION: '10.x'
  NODE_VERSION: '24.x'
  PROJECT_PATH: src/REG.Angular
  AZURE_ANGULAR_WEBAPP_NAME: app-reg-angular
  AZURE_ANGULAR_WEBAPP_PACKAGE_PATH: '.'

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-webapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up dependency caching for faster builds
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: Run Tests
        run: dotnet test --no-restore --verbosity normal

      - name: dotnet publish
        run: dotnet publish ./src/REG.WebApi/REG.WebApi.csproj -c Release -o ${{env.DOTNET_ROOT}}/webapi

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/webapi

  build-angular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.PROJECT_PATH }}/package-lock.json

      - name: Replace token
        uses: cschleiden/replace-tokens@v1
        with:
          files: '["**/*.ts"]'
        env:
          API_URL: ${{ secrets.AZURE_WEBAPP_API_URL }}

      - name: Install Angular Dependencies
        working-directory: ${{ env.PROJECT_PATH }}
        run: npm ci

      - name: Build Angular
        working-directory: ${{ env.PROJECT_PATH }}
        run: npm run build

      - name: Prepare deployment bundle
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          mkdir -p deploy
          cp package*.json deploy/
          cp -R dist deploy/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: .angular
          path: ${{env.PROJECT_PATH}}/deploy
  
  github-release:
    needs: [ build-webapi, build-angular ]
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          token: ${{ secrets.RELEASE_TOKEN }}
  
  deploy-webapi:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [ build-webapi ]
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy-angular:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [ build-angular ]

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: .angular

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_ANGULAR_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_ANGULAR_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_ANGULAR_WEBAPP_PACKAGE_PATH }}